name: Feature request
description: Suggest an improvement or something new.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Sketches and examples welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds, or how other tools handle it (ideas only; nothing is copied).
